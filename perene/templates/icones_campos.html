{% comment %}
Ícones dos campos das telas de entrada. Cada símbolo tem o nome do campo
(id="campo-<nome>"), então o auth.html usa <use href="#campo-{{ campo.name }}">.
Traço simples, 24x24, cor herdada (currentColor).
{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <defs>
        <g id="g-email" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
        </g>
        <g id="g-cadeado" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </g>
    </defs>
    <symbol id="campo-email" viewBox="0 0 24 24"><use href="#g-email"/></symbol>
    <symbol id="campo-usuario" viewBox="0 0 24 24"><use href="#g-email"/></symbol>
    <symbol id="campo-senha" viewBox="0 0 24 24"><use href="#g-cadeado"/></symbol>
    <symbol id="campo-confirmar_senha" viewBox="0 0 24 24"><use href="#g-cadeado"/></symbol>
    <symbol id="campo-nome" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="7" r="4"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>
    </symbol>
    <symbol id="campo-nome_mercado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M10 20v-6h4v6"/>
    </symbol>
    <symbol id="campo-cidade_mercado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="campo-codigo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>
    </symbol>
    <symbol id="campo-codigo_mercado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
    </symbol>
    <symbol id="campo-olho" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
</svg>
