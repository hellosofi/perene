{% extends "base.html" %}

{% block titulo %}Registrar lote — Perene{% endblock %}
{% block titulo_pagina %}Registrar lote{% endblock %}

{% block conteudo %}
<div class="conteudo-pagina">
    <h1>Novo lote de {{ produto.nome }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="botao-primario">Salvar</button>
    </form>

    <a href="{% url 'lista_produtos' %}">Voltar</a>
</div>
{% endblock %}
